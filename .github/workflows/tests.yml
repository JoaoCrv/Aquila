name: Tests

# The property-based tests in Aquila.Tests: each rule is tried against hundreds of generated inputs, and preset
# import against hundreds of random files — the one door through which Aquila reads something it did not write.
# OpenSSF Scorecard reads FsCheck as fuzzing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Locked, like every restore here: the app's packages and the test packages, hash for hash.
      - name: Restore
        run: dotnet restore Aquila.Tests/Aquila.Tests.csproj --locked-mode

      - name: Test
        run: dotnet test Aquila.Tests/Aquila.Tests.csproj --no-restore
