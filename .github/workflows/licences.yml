name: Licences

# Every package the installer ships must carry an allowed licence, and THIRD-PARTY-NOTICES.txt must list them as
# they are. Runs whenever the packages could have changed — including Dependabot's pull requests, where a bumped
# package fails this until the notices are regenerated with tools/Update-ThirdPartyNotices.ps1.

on:
  push:
    branches: [master]
    paths: &licence-paths
      - Aquila.csproj
      - THIRD-PARTY-NOTICES.txt
      - tools/**
      - .config/dotnet-tools.json
      - .github/workflows/licences.yml
  pull_request:
    branches: [master]
    paths: *licence-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Check licences and notices
        shell: pwsh
        run: ./tools/Update-ThirdPartyNotices.ps1 -Check
